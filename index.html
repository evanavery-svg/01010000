<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tracer — Price Checker</title>
  <meta name="description" content="Check any item's price history over the past year and find the best time to buy." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracer" />

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body data-theme="dark">
  <div class="bg-orb" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Tracer home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 15 8 13 9.5 17 13 8 16 13 21 4" />
          <circle cx="21" cy="4" r="0.1" />
        </svg>
      </span>
      <span class="brand-name">Tracer</span>
    </a>
    <button id="themeToggle" class="ghost-btn" type="button" aria-label="Toggle color theme" title="Toggle theme">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    </button>
  </header>

  <main class="wrap">
    <section class="hero" id="hero">
      <p class="quote">“Never pay full price again.”</p>
      <h1 class="headline">Know the <span class="accent">real</span> price.</h1>
      <p class="subhead">A year of price history for anything you search — so you buy at the right moment.</p>

      <form id="searchForm" class="search" role="search" autocomplete="off">
        <span class="search-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
          </svg>
        </span>
        <input id="searchInput" name="q" type="text" inputmode="search"
               placeholder="Search an item or paste a product link" aria-label="Item or product link to check"
               role="combobox" aria-expanded="false" aria-controls="autocomplete" aria-autocomplete="list" />
        <button class="search-btn" type="submit">
          <span class="search-btn-label">Check</span>
          <svg class="search-btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <ul id="autocomplete" class="ac" role="listbox" aria-label="Suggestions" hidden></ul>
      </form>

      <div class="suggests" id="suggests" aria-label="Popular searches"></div>
    </section>

    <section id="result" class="result" hidden aria-live="polite"></section>

    <section id="recent" class="recent" aria-label="Recently viewed" hidden></section>

    <section id="deals" class="deals" aria-label="Trending deals"></section>

    <p class="data-note">
      Estimated history shown for illustration. Set <code>apiBase</code> in
      <code>js/config.js</code> to surface live data.
    </p>
  </main>

  <footer class="footer">
    <span>Tracer</span>
    <span class="dot">·</span>
    <span>Installable · works offline</span>
    <span class="dot">·</span>
    <span class="version">v1.5.0</span>
  </footer>

  <!-- Hover tooltip lives at body level so it can overflow the chart card -->
  <div id="tooltip" class="tooltip" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
